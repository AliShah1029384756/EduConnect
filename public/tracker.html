<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracker - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">EduConnect</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="forum.html">Forum</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="counseling.html">Counseling</a>
        <button class="btn btn-light ms-3" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-3">Weekly Progress Tracker</h2>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Add Entry</h5>
            <form id="trackerForm">
              <div class="mb-2">
                <label class="form-label">Focus Hours</label>
                <input type="number" min="0" step="0.5" id="focusHours" class="form-control" required title="Focus hours" aria-label="Focus hours">
              </div>
              <div class="mb-2">
                <label class="form-label">Mood</label>
                <select id="mood" class="form-select" required title="Mood" aria-label="Mood">
                  <option value="motivated">Motivated</option>
                  <option value="neutral">Neutral</option>
                  <option value="stressed">Stressed</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label">Completed Tasks</label>
                <input type="number" min="0" id="completedTasks" class="form-control" required title="Completed tasks" aria-label="Completed tasks">
              </div>
              <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea id="notes" class="form-control" rows="3" title="Notes" aria-label="Notes"></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Save Entry</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Summary</h5>
            <div id="summaryBox" class="row g-2"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Recent Entries</h5>
            <div id="entriesBox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/tracker.js"></script>
</body>
</html>
