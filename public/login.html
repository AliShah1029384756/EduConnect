<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page page-fade">
  <div class="auth-container">
    <div class="text-center mb-4">
      <span class="auth-badge">EduConnect</span>
      <h2 class="mt-3">Welcome Back</h2>
      <p class="text-muted mb-0">Sign in to continue your learning journey</p>
    </div>

    <div id="alertsContainer"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
      <div class="text-center">
        <a href="forgot-password.html" class="text-muted">Forgot password?</a>
        <p class="mt-3">Don't have an account? <a href="register.html">Sign up</a></p>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = await login(email, password);
      if (!result.ok) {
        showToast(result.message, 'error');
      }
    });
  </script>
</body>
</html>
