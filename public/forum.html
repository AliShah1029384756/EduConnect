<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Forum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">EduConnect</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="tracker.html">Tracker</a>
        <a class="nav-link" href="counseling.html">Counseling</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <span class="navbar-text me-3">
          Welcome, <span id="usernameDisplay"></span>
        </span>
        <button class="btn btn-light" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Alerts Container -->
  <div id="alertsContainer" class="container mt-3"></div>

  <!-- Main Content -->
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Forum Discussions</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newPostModal">
        <i class="bi bi-plus-circle"></i> New Post
      </button>
    </div>

    <!-- Search Bar -->
    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Search posts...">
    </div>

    <!-- Posts Container -->
    <div id="postsContainer" class="row g-4">
      <!-- Posts will be loaded here dynamically -->
    </div>
  </div>

  <!-- New Post Modal -->
  <div class="modal fade" id="newPostModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create New Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="postForm">
            <div class="mb-3">
              <label for="postTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="postTitle" required>
            </div>
            <div class="mb-3">
              <label for="postDescription" class="form-label">Content</label>
              <textarea class="form-control" id="postDescription" rows="6" required></textarea>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-send"></i> Post to Forum
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forum.js"></script>

  <script>
    // Display current username
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (user && user.name) {
        document.getElementById('usernameDisplay').textContent = user.name;
      }
    });

    // Simple logout function (should be in auth.js)
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
