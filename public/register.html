<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page page-fade">
  <div class="auth-container">
    <div class="text-center mb-4">
      <span class="auth-badge">EduConnect</span>
      <h2 class="mt-2">Create Your Account</h2>
      <p class="text-muted mb-0">Join EduConnect and start learning with community support</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
      <div class="text-center">
        <p class="mb-0">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const result = await register(name, email, password);
      showToast(result.message || (result.ok ? 'Account created.' : 'Unable to create account.'), result.ok ? 'success' : 'error');

      if (result.ok && !localStorage.getItem('token')) {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
