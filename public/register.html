<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <h2 class="mb-3 text-center">Create Account</h2>
    <form id="registerForm">
      <div class="mb-2">
        <label class="form-label">Full Name</label>
        <input id="name" class="form-control" required title="Full name" aria-label="Full name">
      </div>
      <div class="mb-2">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required title="Email" aria-label="Email">
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" required title="Password" aria-label="Password">
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select id="role" class="form-select" title="Role" aria-label="Role">
          <option value="student">Student</option>
          <option value="counselor">Counselor</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      <div class="text-center mt-3">
        <a href="login.html">Already have an account? Sign in</a>
      </div>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const payload = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: document.getElementById('role').value
        };
        const data = await register(payload);
        window.location.href = data.user.role === 'admin' ? 'admin.html' : 'forum.html';
      } catch (err) {
        alert(err.message || 'Signup failed');
      }
    });
  </script>
</body>
</html>
