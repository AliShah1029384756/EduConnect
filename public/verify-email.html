<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - EduConnect</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page page-fade">
  <div class="auth-container text-center">
    <span class="auth-badge">EduConnect</span>
    <h2 class="mt-3">Verify Your Email</h2>
    <p class="text-muted">In this demo build, email verification is simulated.</p>
    <button id="verifyBtn" class="btn btn-primary w-100">Mark Email as Verified</button>
    <a class="btn btn-link mt-3" href="login.html">Go to Login</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.getElementById('verifyBtn').addEventListener('click', () => {
      showToast('Email verified successfully.', 'success');
      setTimeout(() => (window.location.href = 'login.html'), 700);
    });
  </script>
</body>
</html>
