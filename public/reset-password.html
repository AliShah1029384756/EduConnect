<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EduConnect</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page page-fade">
  <div class="auth-container">
    <span class="auth-badge">EduConnect</span>
    <h2 class="mt-3">Set a New Password</h2>
    <form id="resetForm" class="mt-3">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" class="form-control" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="newPassword">New Password</label>
        <input id="newPassword" class="form-control" type="password" minlength="6" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Update Password</button>
    </form>
    <a class="btn btn-link mt-3" href="login.html">Back to Login</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      const response = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, newPassword })
      });

      const data = await response.json();
      if (response.ok) {
        showToast(data.message || 'Password updated.', 'success');
        setTimeout(() => (window.location.href = 'login.html'), 900);
      } else {
        showToast(data.message || 'Failed to reset password.', 'error');
      }
    });
  </script>
</body>
</html>
