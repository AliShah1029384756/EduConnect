<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">EduConnect</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="forum.html">Forum</a>
        <a class="nav-link" href="counseling.html">Counseling</a>
        <a class="nav-link" href="tracker.html">Tracker</a>
        <button class="btn btn-light ms-3" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Learning Resources</h2>
      <a class="btn btn-outline-primary" href="profile.html">My Profile</a>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="Search resources...">
      </div>
      <div class="col-md-4">
        <select id="categoryInput" class="form-select" title="Resource category" aria-label="Resource category">
          <option value="">All categories</option>
          <option value="study-skills">Study Skills</option>
          <option value="career">Career</option>
          <option value="wellbeing">Wellbeing</option>
        </select>
      </div>
    </div>

    <div id="resourcesContainer" class="row g-3"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/resources.js"></script>
</body>
</html>
