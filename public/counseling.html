<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counseling - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">EduConnect</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="forum.html">Forum</a>
        <button class="btn btn-light ms-3" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between mb-4">
      <h2>Counseling Sessions</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal">
        Book Session
      </button>
    </div>

    <div id="sessionsContainer" class="row">
      <!-- Sessions will be loaded here -->
    </div>
  </div>

  <!-- Booking Modal -->
  <div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Counseling Session</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="bookingForm">
            <div class="mb-3">
              <label class="form-label">Topic</label>
              <select class="form-select" id="topicSelect" required>
                <option value="">Select a topic</option>
                <option>Academic Guidance</option>
                <option>Career Counseling</option>
                <option>Mental Health</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="sessionDate" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Time</label>
              <input type="time" class="form-control" id="sessionTime" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Additional Details</label>
              <textarea class="form-control" id="sessionNotes" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Book Session</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/counseling.js"></script>
</body>
</html>
